name: Tools

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [gui, optimizer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: "**/cpm_modules"
          key: tools-cpm-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Install Qt
        if: matrix.tool == 'gui'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6opengl6-dev
      - name: Configure
        run: cmake -S${{ matrix.tool }} -Bbuild -DCMAKE_BUILD_TYPE=Release -DKokkos_ENABLE_OPENMP=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
